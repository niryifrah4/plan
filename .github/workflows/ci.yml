name: CI

# שומר הסף של הקוד. כל שינוי עובר typecheck ו-build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run typecheck
      - run: npm run typecheck --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm run build --prefix frontend
      - run: npm run build --prefix backend
      # Known transitive issues are reported, but do not hide the audit result.
      - name: Dependency audit report
        run: npm audit --omit=dev --audit-level=high || true

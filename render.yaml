# Render Blueprint — Plan App production deploy
#
# Usage:
#   1. Push this file to your repo (already done if you see it).
#   2. In Render dashboard → New + → Blueprint → connect this repo.
#   3. Render reads this file and provisions everything.
#   4. After creation, fill the env vars marked `sync: false` from the
#      project's Environment tab (they're prompted as secrets, not echoed).
#
# Region: frankfurt — closest to Israeli users (~80ms RTT vs 200ms US-East).
# Plan:   starter — $7/mo, no spin-down, no cold starts. Sufficient for the
#         50-user beta.

services:
  - type: web
    name: plan-backend
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://plan-frontend.onrender.com" # adjust to final frontend URL
      # ── Supabase (set as secrets in dashboard) ─────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Sentry (optional) ──────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      # ── Google Calendar (optional) ─────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: plan-frontend
    runtime: static
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    branch: main
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE
        value: "https://plan-backend.onrender.com" # adjust to final backend URL

      # ── Cron secret (used by /api/market/prices manual triggers) ───────
      - key: CRON_SECRET
        generateValue: true

# Cron note (deferred to post-launch):
#  Render Cron Jobs ($1/mo each) can hit /api/market/prices daily. For now
#  the endpoint accepts manual GET requests + a Vercel-style cron header.
#  Easiest free alternative: cron-job.org → set up a daily POST to
#  https://app.your-domain.co.il/api/market/prices with header
#  Authorization: Bearer ${CRON_SECRET}.
